<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experience Journal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #000;
        }
        /* Fullscreen Photo Layers */
        #bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .bg-slide {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transform: scale(1);
            filter: none;
            transition: opacity 5s ease-in-out;
            will-change: opacity;
        }
        .bg-slide.active {
            opacity: 1;
            filter: none;
            transform: scale(1);
        }
        body.entry-001 .bg-slide.active {
            animation: fadeBreath 18s ease-in-out infinite alternate;
        }
        .bg-slide.drift-a.active {
            background-position: center;
            transform: scale(1);
        }
        .bg-slide.drift-b.active {
            background-position: center;
            transform: scale(1);
        }
        .bg-slide.drift-c.active {
            background-position: center;
            transform: scale(1);
        }
        #atmosphere-overlay {
            display: none;
        }
        @keyframes fadeBreath {
            0% {
                transform: scale(1);
                filter: brightness(0.96) contrast(1.04);
            }
            100% {
                transform: scale(1.045);
                filter: brightness(1.08) contrast(1.12);
            }
        }
        #processing-canvas,
        #circle-mask-canvas,
        #reveal-under-canvas,
        #reveal-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            cursor: crosshair;
            touch-action: none;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        #reveal-under-canvas {
            z-index: 1;
        }
        #reveal-canvas {
            z-index: 2;
        }
        #circle-mask-canvas {
            z-index: 2;
        }
        #processing-canvas {
            z-index: 2;
        }
        #reveal-canvas.refreshing {
            animation: revealSurfaceIn 6s ease both;
        }
        #reveal-under-canvas.active,
        #reveal-canvas.active,
        #circle-mask-canvas.active,
        #processing-canvas.active {
            opacity: 1;
            visibility: visible;
        }
        @keyframes revealSurfaceIn {
            0% {
                opacity: 0;
                filter: blur(18px) brightness(1.3);
            }
            100% {
                opacity: 1;
                filter: blur(0) brightness(1);
            }
        }

        /* Initial Unlock Overlay */
        #setup-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        #start-btn {
            padding: 15px 40px;
            font-size: 1.1rem;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(255,255,255,0.1);
            transition: all 0.2s ease;
        }
        #start-btn:hover {
            transform: scale(1.03);
            background: #e5e5e5;
        }

        /* Minimal Top-Left Interface */
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 3;
            display: flex;
            align-items: center;
            gap: 18px;
            background: rgba(0, 0, 0, 0.26);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 10px 12px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #ui-panel.visible {
            opacity: 1;
            visibility: visible;
        }
        #journal-dots,
        #audio-player {
            display: flex;
            align-items: center;
        }
        #journal-dots {
            gap: 11px;
        }
        .journal-dot {
            width: 13px;
            height: 13px;
            border: 1px solid rgba(255, 255, 255, 0.92);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.28);
            cursor: pointer;
            padding: 0;
            transition: background 0.25s ease, transform 0.25s ease, opacity 0.25s ease;
        }
        .journal-dot.active {
            background: #fff;
            transform: scale(1.18);
        }
        #audio-player {
            gap: 12px;
            min-width: min(430px, calc(100vw - 116px));
        }
        #audio-readout {
            width: min(260px, 36vw);
            color: rgba(255, 255, 255, 0.84);
            font-size: 0.72rem;
            line-height: 1.25;
            font-weight: 600;
        }
        #track-name {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #track-time {
            display: block;
            margin-top: 2px;
            color: rgba(255, 255, 255, 0.58);
            font-variant-numeric: tabular-nums;
        }
        #track-progress {
            width: 100%;
            height: 2px;
            margin-top: 6px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 999px;
        }
        #track-progress-bar {
            width: 0%;
            height: 100%;
            background: rgba(255, 255, 255, 0.78);
            border-radius: inherit;
        }
        .text-control {
            border: 0;
            background: transparent;
            color: rgba(255, 255, 255, 0.78);
            cursor: pointer;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: lowercase;
            padding: 2px 0;
        }
        #sketch-loader {
            position: absolute;
            inset: 0;
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            background: rgba(0, 0, 0, 0.46);
            color: #fff;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        #sketch-loader.visible {
            opacity: 1;
            visibility: visible;
        }
        #sketch-loader-content {
            width: min(220px, 54vw);
            height: 3px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.14);
            border-radius: 999px;
        }
        #sketch-loader-content::after {
            content: "";
            display: block;
            width: 42%;
            height: 100%;
            background: rgba(255, 255, 255, 0.84);
            border-radius: inherit;
            animation: loadingBar 1.05s ease-in-out infinite;
        }
        @keyframes loadingBar {
            0% { transform: translateX(-105%); }
            100% { transform: translateX(245%); }
        }
        @media (max-width: 520px) {
            #ui-panel {
                left: 12px;
                top: 12px;
                right: 12px;
                gap: 12px;
                border-radius: 16px;
                align-items: flex-start;
            }
            #audio-player {
                min-width: 0;
                flex: 1;
                gap: 9px;
            }
            #audio-readout {
                width: auto;
                min-width: 0;
            }
            input[type="range"] {
                width: 52px;
            }
        }

        /* Control Panel Elements */
        /* Volume Container & Slider Styling */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body class="entry-001">

    <div id="atmosphere-overlay" aria-hidden="true"></div>
    <canvas id="reveal-under-canvas" aria-hidden="true"></canvas>

    <script>
        // ASSETS CONFIGURATION: Swap these placeholders with your actual server file paths!
        const IMAGES = [
            "assets/images/dsc-0008.jpg",
            "assets/images/dsc-0009.jpg",
            "assets/images/dsc-0010.jpg",
            "assets/images/dsc-0025.jpg",
            "assets/images/dsc-0032.jpg",
            "assets/images/dsc-0033.jpg",
            "assets/images/dsc-0039.jpg",

        ];

        const AUDIO_TRACKS = [
            "assets/audio/birds.mp3",
            "assets/audio/walking-sounds-2.mp3",
            "assets/audio/walking-sounds.mp3",
            "assets/audio/slow-walking-sounds.mp3",
            "assets/audio/night-sounds.mp3",
            "assets/audio/morning-sounds-2026-09-15.mp3"
        ];

        const AUDIO_LABELS = {
            "assets/audio/birds.mp3": "Birds",
            "assets/audio/walking-sounds-2.mp3": "Walking Sounds 2",
            "assets/audio/walking-sounds.mp3": "Walking Sounds",
            "assets/audio/slow-walking-sounds.mp3": "Slow Walking Sounds",
            "assets/audio/night-sounds.mp3": "Night Sounds",
            "assets/audio/morning-sounds-2026-09-15.mp3": "Morning Sounds 9-15-2026"
        };

        const SKETCH_AUDIO_MODE = {
            "001": "ambient-cycle",
            "002": "hold",
            "003": "hold",
            "004": "hold",
            "005": "hold",
            "006": "hold",
            "007": "hold",
            "008": "hold",
            "009": "hold",
            "010": "hold",
            "011": "hold",
            "012": "hold",
            "013": "hold",
            "014": "hold",
            "015": "hold",
            "016": "hold",
            "017": "hold",
            "018": "hold",
            "019": "hold"
        };

        const SKETCH_LABELS = {
            "001": "Fade",
            "002": "Pixel Reveal",
            "003": "Concentric Masks",
            "004": "Granular Shatter",
            "005": "Additive Remix",
            "006": "PerlinNoiseSlider",
            "007": "ScanLines",
            "008": "TrailingCircle",
            "009": "CirclePatternSketch",
            "010": "CircleLine",
            "011": "imageslice",
            "012": "dot-connect",
            "013": "Wander-Web",
            "014": "GradientNodes",
            "015": "GradientDrag",
            "016": "ColorPills",
            "017": "AntiGravity_001",
            "018": "midi-experiments",
            "019": "digital-nature"
        };

        // Core Systems Configuration
        let audioCtx;
        let masterGainNode; // Parent master volume slider tracking node
        let currentSourceNode = null;
        let currentTrackGainNode = null;
        let currentTrackIndex = -1;
        let currentTrackStartedAt = 0;
        let currentTrackDuration = 0;
        let currentTrackLabel = 'No audio playing';
        
        let isMuted = false;
        let preMuteVolume = 1;
        let activeEntry = '001';
        let currentImageIndex = 0;
        let revealImageStack = [];
        let revealTopImage = null;
        let revealReady = false;
        let revealCycleIndex = 0;
        let revealBrushCount = 0;
        let revealMiddleActive = false;
        let circleImage = null;
        let previousCircleImage = null;
        let circleFadeStart = 0;
        let circleImageIndex = 0;
        let circleSpin = 0;
        let circleAnimationId = null;
        let revealPointerDownX = 0;
        let revealPointerDownY = 0;
        let revealPointerMoved = false;
        let processingAnimationId = null;
        let processingPointerX = 0.5;
        let processingPointerY = 0.5;
        let processingTime = 0;
        let shatterImage = null;
        let shatterImageIndex = 0;
        let shatterParticles = [];
        let shatterAnimationId = null;
        let shatterPointerDownX = 0;
        let shatterPointerDownY = 0;
        let shatterPointerMoved = false;
        let remixImageIndex = 0;
        let remixSources = [];
        let remixPointerDownX = 0;
        let remixPointerDownY = 0;
        let remixPointerMoved = false;
        let glitchPointerDown = false;
        let lastGlitchX = 0;
        let lastGlitchY = 0;
        let glitchFadeAnimationId = null;
        const imageCache = new Map();
        let loaderTimeout = null;
        const FADE_DURATION = 4.0; // Audio crossfade overlap length (seconds)
        const DRIFT_CLASSES = ['drift-a', 'drift-b', 'drift-c'];

        // Inject background elements into standard browser template DOM
        const bgContainer = document.getElementById('bg-container');
        IMAGES.forEach((src, idx) => {
            const div = document.createElement('div');
            div.className = 'bg-slide';
            div.style.backgroundImage = `url('${src}')`;
            if (idx === 0) div.classList.add('active');
            bgContainer.appendChild(div);
        });

        const revealCanvas = document.getElementById('reveal-canvas');
        const revealUnderCanvas = document.getElementById('reveal-under-canvas');
        const circleMaskCanvas = document.getElementById('circle-mask-canvas');
        const processingCanvas = document.getElementById('processing-canvas');
        const revealCtx = revealCanvas.getContext('2d', { alpha: true });
        const revealUnderCtx = revealUnderCanvas.getContext('2d', { alpha: true });
        const circleMaskCtx = circleMaskCanvas.getContext('2d', { alpha: true });
        const processingCtx = processingCanvas.getContext('2d', { alpha: true });
        const sketchLoader = document.getElementById('sketch-loader');
        const journalDots = Array.from(document.querySelectorAll('.journal-dot'));
        const trackName = document.getElementById('track-name');
        const trackTime = document.getElementById('track-time');
        const trackProgressBar = document.getElementById('track-progress-bar');

        function loadImage(src) {
            if (imageCache.has(src)) return imageCache.get(src);
            const promise = new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = src;
            });
            imageCache.set(src, promise);
            return promise;
        }

        IMAGES.forEach(src => loadImage(src).catch(() => {}));

        function drawImageCover(ctx, canvas, img) {
            const canvasRatio = canvas.width / canvas.height;
            const imageRatio = img.naturalWidth / img.naturalHeight;
            let width = canvas.width;
            let height = canvas.height;
            let x = 0;
            let y = 0;

            if (imageRatio > canvasRatio) {
                height = canvas.height;
                width = height * imageRatio;
                x = (canvas.width - width) / 2;
            } else {
                width = canvas.width;
                height = width / imageRatio;
                y = (canvas.height - height) / 2;
            }

            ctx.drawImage(img, x, y, width, height);
        }

        function getCoverRect(canvas, img) {
            const canvasRatio = canvas.width / canvas.height;
            const imageRatio = img.naturalWidth / img.naturalHeight;
            let width = canvas.width;
            let height = canvas.height;
            let x = 0;
            let y = 0;

            if (imageRatio > canvasRatio) {
                height = canvas.height;
                width = height * imageRatio;
                x = (canvas.width - width) / 2;
            } else {
                width = canvas.width;
                height = width / imageRatio;
                y = (canvas.height - height) / 2;
            }

            return { x, y, width, height };
        }

        function resizeRevealCanvas() {
            const dpr = window.devicePixelRatio || 1;
            revealCanvas.width = Math.floor(window.innerWidth * dpr);
            revealCanvas.height = Math.floor(window.innerHeight * dpr);
            revealUnderCanvas.width = revealCanvas.width;
            revealUnderCanvas.height = revealCanvas.height;
            circleMaskCanvas.width = revealCanvas.width;
            circleMaskCanvas.height = revealCanvas.height;
            processingCanvas.width = revealCanvas.width;
            processingCanvas.height = revealCanvas.height;
            revealCanvas.style.width = `${window.innerWidth}px`;
            revealCanvas.style.height = `${window.innerHeight}px`;
            revealUnderCanvas.style.width = revealCanvas.style.width;
            revealUnderCanvas.style.height = revealCanvas.style.height;
            circleMaskCanvas.style.width = revealCanvas.style.width;
            circleMaskCanvas.style.height = revealCanvas.style.height;
            processingCanvas.style.width = revealCanvas.style.width;
            processingCanvas.style.height = revealCanvas.style.height;
            if (activeEntry === '002' && revealReady) {
                renderRevealStack();
            }
            if (activeEntry === '003' && circleImage) {
                renderCircleMasks();
            }
            if (activeEntry === '006') {
                renderPerlinNoiseSlider();
            }
            if (activeEntry === '005') {
                prepareAdditiveRemix(false);
            }
        }

        function setVisibleBackground(index) {
            const slides = document.querySelectorAll('.bg-slide');
            slides.forEach(slide => slide.classList.remove('active', ...DRIFT_CLASSES));
            if (slides[index]) {
                const driftClass = DRIFT_CLASSES[Math.floor(Math.random() * DRIFT_CLASSES.length)];
                slides[index].classList.add('active', driftClass);
            }
            currentImageIndex = index;
        }

        function transitionImage() {
            const slides = document.querySelectorAll('.bg-slide');
            if (slides.length === 0) return;
            const randomIndex = randomImageIndex(currentImageIndex);
            setVisibleBackground(randomIndex);
            if (activeEntry === '001') {
                processingCtx.clearRect(0, 0, processingCanvas.width, processingCanvas.height);
            }
        }

        function randomImageIndex(exceptIndex = -1) {
            if (IMAGES.length <= 1) return 0;
            let index = Math.floor(Math.random() * IMAGES.length);
            while (index === exceptIndex) {
                index = Math.floor(Math.random() * IMAGES.length);
            }
            return index;
        }

        function startGlitchFade() {
            if (glitchFadeAnimationId) cancelAnimationFrame(glitchFadeAnimationId);
            const tick = () => {
                if (activeEntry !== '001') {
                    glitchFadeAnimationId = null;
                    return;
                }
                processingCtx.save();
                processingCtx.globalCompositeOperation = 'destination-out';
                processingCtx.fillStyle = 'rgba(0, 0, 0, 0.004)';
                processingCtx.fillRect(0, 0, processingCanvas.width, processingCanvas.height);
                processingCtx.restore();
                glitchFadeAnimationId = requestAnimationFrame(tick);
            };
            tick();
        }

        async function drawGlitchAt(event, smear = false) {
            if (activeEntry !== '001') return;
            const dpr = window.devicePixelRatio || 1;
            const rect = processingCanvas.getBoundingClientRect();
            const x = (event.clientX - rect.left) * dpr;
            const y = (event.clientY - rect.top) * dpr;
            const velocityX = lastGlitchX ? x - lastGlitchX : 0;
            const velocityY = lastGlitchY ? y - lastGlitchY : 0;
            const motion = Math.min(160 * dpr, Math.hypot(velocityX, velocityY));
            const sourceIndex = (currentImageIndex + 1) % IMAGES.length;
            const img = await loadImage(IMAGES[sourceIndex]);
            if (activeEntry !== '001') return;
            const cover = getCoverRect(processingCanvas, img);
            const sourceX = ((x - cover.x) / cover.width) * img.naturalWidth;
            const sourceY = ((y - cover.y) / cover.height) * img.naturalHeight;
            const pixel = (smear ? 8 + Math.random() * 22 : 13 + Math.random() * 24) * dpr;
            const count = smear ? 30 : 16;

            if (smear) {
                processingCtx.save();
                processingCtx.imageSmoothingEnabled = false;
                processingCtx.globalAlpha = 0.52;
                const feedbackCount = 7;
                for (let i = 0; i < feedbackCount; i++) {
                    const bandW = (28 + Math.random() * 120) * dpr;
                    const bandH = (4 + Math.random() * 18) * dpr;
                    const srcX = Math.max(0, Math.min(processingCanvas.width - bandW, x - bandW * 0.5 + (Math.random() - 0.5) * 90 * dpr));
                    const srcY = Math.max(0, Math.min(processingCanvas.height - bandH, y + (Math.random() - 0.5) * 110 * dpr));
                    const dragX = (velocityX * (1.2 + Math.random() * 3.8)) + (Math.random() - 0.5) * 42 * dpr;
                    const dragY = velocityY * (0.08 + Math.random() * 0.28);
                    processingCtx.drawImage(
                        processingCanvas,
                        srcX,
                        srcY,
                        bandW,
                        bandH,
                        srcX + dragX,
                        srcY + dragY,
                        bandW * (1.15 + Math.random() * 1.7),
                        bandH
                    );
                }
                processingCtx.restore();
            }

            processingCtx.save();
            processingCtx.globalCompositeOperation = 'screen';
            processingCtx.globalAlpha = smear ? 0.42 : 0.24;
            const lcdCount = smear ? 8 : 4;
            for (let i = 0; i < lcdCount; i++) {
                const lineX = x + (Math.random() - 0.5) * (smear ? 160 : 70) * dpr;
                const lineHeight = (smear ? 90 + Math.random() * 360 : 36 + Math.random() * 120) * dpr;
                const lineWidth = (1 + Math.random() * (smear ? 5 : 3)) * dpr;
                const lineY = y - lineHeight * (0.2 + Math.random() * 0.6);
                processingCtx.fillStyle = i % 3 === 0
                    ? 'rgba(255, 42, 82, 0.42)'
                    : i % 3 === 1
                        ? 'rgba(37, 214, 255, 0.38)'
                        : 'rgba(230, 255, 74, 0.34)';
                processingCtx.fillRect(lineX, lineY, lineWidth, lineHeight);
            }
            processingCtx.restore();

            processingCtx.save();
            processingCtx.imageSmoothingEnabled = false;
            processingCtx.globalAlpha = smear ? 0.92 : 0.96;

            for (let i = 0; i < count; i++) {
                const jitterX = (Math.random() - 0.5) * pixel * (smear ? 5 : 2);
                const jitterY = (Math.random() - 0.5) * pixel * (smear ? 2.2 : 2);
                const sx = Math.max(0, Math.min(img.naturalWidth - 2, sourceX + jitterX / dpr));
                const sy = Math.max(0, Math.min(img.naturalHeight - 2, sourceY + jitterY / dpr));
                const sw = Math.min(Math.max(2, (pixel * (smear ? 1.8 : 1)) / dpr), img.naturalWidth - sx);
                const sh = Math.min(Math.max(2, (pixel * (smear ? 0.42 : 1)) / dpr), img.naturalHeight - sy);
                const direction = velocityX === 0 ? (Math.random() > 0.5 ? 1 : -1) : Math.sign(velocityX);
                const dw = smear ? pixel * (7 + Math.random() * 18 + motion * 0.04) : pixel * (1 + Math.random() * 1.8);
                const dh = smear ? Math.max(3 * dpr, pixel * (0.24 + Math.random() * 0.5)) : pixel * (1 + Math.random() * 1.6);
                const dx = x + jitterX - (direction < 0 ? dw : 0) + velocityX * (0.4 + Math.random() * 1.1);
                const dy = y + jitterY;
                processingCtx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
            }

            processingCtx.restore();
            lastGlitchX = x;
            lastGlitchY = y;
        }

        function handleGlitchPointerMove(event) {
            if (activeEntry !== '001') return;
            drawGlitchAt(event, glitchPointerDown);
        }

        function handleGlitchPointerDown(event) {
            if (activeEntry !== '001') return;
            glitchPointerDown = true;
            const dpr = window.devicePixelRatio || 1;
            const rect = processingCanvas.getBoundingClientRect();
            lastGlitchX = (event.clientX - rect.left) * dpr;
            lastGlitchY = (event.clientY - rect.top) * dpr;
            processingCanvas.setPointerCapture(event.pointerId);
            drawGlitchAt(event, true);
        }

        function handleGlitchPointerUp() {
            glitchPointerDown = false;
        }

        function formatTime(seconds) {
            if (!Number.isFinite(seconds) || seconds < 0) return '00:00';
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);
            return `${String(minutes).padStart(2, '0')}:${String(remainingSeconds).padStart(2, '0')}`;
        }

        function updateAudioReadout() {
            let elapsed = 0;
            if (audioCtx && currentTrackDuration > 0) {
                elapsed = Math.min(currentTrackDuration, Math.max(0, audioCtx.currentTime - currentTrackStartedAt));
            }
            trackName.textContent = currentTrackLabel;
            trackTime.textContent = `${formatTime(elapsed)} / ${formatTime(currentTrackDuration)}`;
            trackProgressBar.style.width = currentTrackDuration > 0 ? `${(elapsed / currentTrackDuration) * 100}%` : '0%';
            requestAnimationFrame(updateAudioReadout);
        }

        async function prepareRevealStack(randomize = false) {
            if (randomize) {
                revealCycleIndex = randomImageIndex(revealCycleIndex);
            } else {
                revealCycleIndex = currentImageIndex;
            }
            const startIndex = revealCycleIndex;
            const imageIndexes = [0, 1, 2].map(offset => (startIndex + offset) % IMAGES.length);
            setVisibleBackground(imageIndexes[0]);

            try {
                const loadedImages = await Promise.all(imageIndexes.map(idx => loadImage(IMAGES[idx])));
                revealImageStack = loadedImages;
                revealTopImage = loadedImages[2];
                revealBrushCount = 0;
                revealMiddleActive = false;
                revealReady = true;
                renderRevealStack();
                animateNewRevealSurface();
            } catch (error) {
                revealReady = false;
                console.error('Reveal images could not be prepared:', error);
            }
        }

        function renderRevealStack() {
            revealUnderCtx.globalCompositeOperation = 'source-over';
            revealUnderCtx.clearRect(0, 0, revealUnderCanvas.width, revealUnderCanvas.height);
            revealUnderCtx.globalAlpha = 1;
            drawImageCover(revealUnderCtx, revealUnderCanvas, revealImageStack[1]);
            revealUnderCtx.globalAlpha = 1;

            revealCtx.globalCompositeOperation = 'source-over';
            revealCtx.clearRect(0, 0, revealCanvas.width, revealCanvas.height);
            revealCtx.globalAlpha = 0.92;
            drawImageCover(revealCtx, revealCanvas, revealTopImage);
            revealCtx.globalAlpha = 1;
        }

        function animateNewRevealSurface() {
            revealCanvas.classList.remove('refreshing');
            void revealCanvas.offsetWidth;
            revealCanvas.classList.add('refreshing');
        }

        function paintPixelReveal(event) {
            if (activeEntry !== '002' || !revealReady) return;
            const rect = revealCanvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            const pressure = event.pressure && event.pressure > 0 ? event.pressure : 0.5;
            const brushRadius = (46 + pressure * 82) * dpr;
            const x = (event.clientX - rect.left) * dpr;
            const y = (event.clientY - rect.top) * dpr;
            const dots = 16 + Math.floor(pressure * 16);

            revealCtx.globalCompositeOperation = 'destination-out';
            if (revealMiddleActive) {
                revealUnderCtx.globalCompositeOperation = 'destination-out';
            }
            for (let i = 0; i < dots; i++) {
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.sqrt(Math.random()) * brushRadius;
                const dotX = x + Math.cos(angle) * distance;
                const dotY = y + Math.sin(angle) * distance;
                const falloff = 1 - distance / brushRadius;
                const radius = (4 + Math.random() * 18) * dpr * (0.5 + falloff * 0.7);
                revealCtx.globalAlpha = 0.24 + falloff * 0.34;
                revealCtx.beginPath();
                revealCtx.arc(dotX, dotY, radius, 0, Math.PI * 2);
                revealCtx.fill();

                if (revealMiddleActive && Math.random() < 0.74) {
                    revealUnderCtx.globalAlpha = 0.12 + falloff * 0.24;
                    revealUnderCtx.beginPath();
                    revealUnderCtx.arc(dotX, dotY, radius * (0.7 + Math.random() * 0.7), 0, Math.PI * 2);
                    revealUnderCtx.fill();
                }
            }
            revealCtx.globalAlpha = 1;
            revealUnderCtx.globalAlpha = 1;
            revealUnderCtx.globalCompositeOperation = 'source-over';
            revealBrushCount += 1;
            if (revealBrushCount > 10) revealMiddleActive = true;
        }

        function showSketchLoader() {
            sketchLoader.classList.add('visible');
            clearTimeout(loaderTimeout);
            loaderTimeout = setTimeout(() => {
                sketchLoader.classList.remove('visible');
            }, 1150);
        }

        async function prepareCircleMasks(randomize = false) {
            const baseIndex = randomize ? randomImageIndex(circleImageIndex) : currentImageIndex;
            circleImageIndex = baseIndex;
            const overlayIndex = randomize ? randomImageIndex(baseIndex) : baseIndex;
            setVisibleBackground(baseIndex);
            try {
                const loadedImage = await loadImage(IMAGES[overlayIndex]);
                previousCircleImage = circleImage;
                circleImage = loadedImage;
                circleFadeStart = performance.now();
                circleSpin = 0;
                startCircleAnimation();
            } catch (error) {
                console.error('Circle mask image could not be prepared:', error);
            }
        }

        function startCircleAnimation() {
            if (circleAnimationId) cancelAnimationFrame(circleAnimationId);
            const tick = () => {
                if (activeEntry !== '003') {
                    circleAnimationId = null;
                    return;
                }
                circleSpin += 0.006;
                renderCircleMasks();
                circleAnimationId = requestAnimationFrame(tick);
            };
            tick();
        }

        function drawCircleImageBands(image, alpha) {
            if (!image || alpha <= 0) return;
            const width = circleMaskCanvas.width;
            const height = circleMaskCanvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const maxRadius = Math.hypot(width, height) * 0.58;
            const ringCount = 12;

            for (let i = ringCount; i >= 1; i--) {
                const radius = (maxRadius / ringCount) * i;
                const nextRadius = (maxRadius / ringCount) * (i - 0.52);
                const offsetStrength = (ringCount - i + 1) / ringCount;
                const offsetX = 0;
                const offsetY = 0;
                const rotation = circleSpin * (i % 2 === 0 ? 1 : -1) * (0.75 + offsetStrength * 2.2);
                const imageOffsetX = 0;
                const imageOffsetY = 0;

                circleMaskCtx.save();
                circleMaskCtx.translate(centerX + offsetX, centerY + offsetY);
                circleMaskCtx.rotate(rotation);
                circleMaskCtx.beginPath();
                circleMaskCtx.arc(0, 0, radius, 0, Math.PI * 2);
                if (nextRadius > 0) {
                    circleMaskCtx.arc(0, 0, nextRadius, 0, Math.PI * 2, true);
                }
                circleMaskCtx.clip('evenodd');
                circleMaskCtx.translate(-centerX - offsetX + imageOffsetX, -centerY - offsetY + imageOffsetY);
                circleMaskCtx.globalAlpha = alpha * (0.64 + offsetStrength * 0.28);
                circleMaskCtx.filter = `contrast(${1.04 + offsetStrength * 0.24}) saturate(${1.02 + offsetStrength * 0.22}) brightness(${1.02 + offsetStrength * 0.08})`;
                drawImageCover(circleMaskCtx, circleMaskCanvas, image);
                circleMaskCtx.restore();
            }
        }

        function renderCircleMasks() {
            if (!circleImage) return;
            const fadeProgress = Math.min(1, (performance.now() - circleFadeStart) / 1800);

            circleMaskCtx.clearRect(0, 0, circleMaskCanvas.width, circleMaskCanvas.height);
            drawCircleImageBands(previousCircleImage, 1 - fadeProgress);
            drawCircleImageBands(circleImage, fadeProgress);

            circleMaskCtx.globalAlpha = 1;
            circleMaskCtx.filter = 'none';
        }

        function handleCirclePointerDown(event) {
            prepareCircleMasks(true);
            playRandomAudioTrack();
        }

        async function prepareShatter(randomize = false) {
            shatterImageIndex = randomize ? randomImageIndex(shatterImageIndex) : currentImageIndex;
            setVisibleBackground(shatterImageIndex);
            try {
                const sampleIndex = randomize ? randomImageIndex(shatterImageIndex) : (shatterImageIndex + 1) % IMAGES.length;
                shatterImage = await loadImage(IMAGES[sampleIndex]);
                shatterParticles = [];
                processingCtx.clearRect(0, 0, processingCanvas.width, processingCanvas.height);
                createShatterBurst(processingCanvas.width * 0.5, processingCanvas.height * 0.5, 120);
                startShatterAnimation();
            } catch (error) {
                console.error('Shatter image could not be prepared:', error);
            }
        }

        function createShatterBurst(x, y, count = 80) {
            if (!shatterImage) return;
            const dpr = window.devicePixelRatio || 1;
            const cover = getCoverRect(processingCanvas, shatterImage);
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.sqrt(Math.random()) * Math.min(processingCanvas.width, processingCanvas.height) * 0.34;
                const px = x + Math.cos(angle) * distance;
                const py = y + Math.sin(angle) * distance;
                const sx = ((px - cover.x) / cover.width) * shatterImage.naturalWidth;
                const sy = ((py - cover.y) / cover.height) * shatterImage.naturalHeight;
                const size = (8 + Math.random() * 34) * dpr;
                const speed = (0.35 + Math.random() * 2.6) * dpr;
                shatterParticles.push({
                    x: px,
                    y: py,
                    sx: Math.max(0, Math.min(shatterImage.naturalWidth - 4, sx)),
                    sy: Math.max(0, Math.min(shatterImage.naturalHeight - 4, sy)),
                    sw: Math.max(4, size / dpr),
                    sh: Math.max(4, size / dpr),
                    w: size * (0.7 + Math.random() * 1.9),
                    h: size * (0.35 + Math.random() * 1.2),
                    vx: Math.cos(angle) * speed + (Math.random() - 0.5) * 1.2 * dpr,
                    vy: Math.sin(angle) * speed + (Math.random() - 0.5) * 1.2 * dpr,
                    spin: (Math.random() - 0.5) * 0.05,
                    rotation: Math.random() * Math.PI,
                    life: 0.62 + Math.random() * 0.38
                });
            }
        }

        function startShatterAnimation() {
            if (shatterAnimationId) cancelAnimationFrame(shatterAnimationId);
            const tick = () => {
                if (activeEntry !== '004') {
                    shatterAnimationId = null;
                    return;
                }
                renderShatter();
                shatterAnimationId = requestAnimationFrame(tick);
            };
            tick();
        }

        function renderShatter() {
            if (!shatterImage) return;
            processingCtx.save();
            processingCtx.globalCompositeOperation = 'source-over';
            processingCtx.fillStyle = 'rgba(0, 0, 0, 0.045)';
            processingCtx.fillRect(0, 0, processingCanvas.width, processingCanvas.height);
            processingCtx.imageSmoothingEnabled = false;

            shatterParticles.forEach(particle => {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.vx *= 0.992;
                particle.vy *= 0.992;
                particle.rotation += particle.spin;
                particle.life *= 0.996;

                processingCtx.save();
                processingCtx.globalAlpha = Math.max(0, particle.life);
                processingCtx.translate(particle.x, particle.y);
                processingCtx.rotate(particle.rotation);
                processingCtx.drawImage(
                    shatterImage,
                    particle.sx,
                    particle.sy,
                    particle.sw,
                    particle.sh,
                    -particle.w * 0.5,
                    -particle.h * 0.5,
                    particle.w,
                    particle.h
                );
                processingCtx.restore();
            });
            shatterParticles = shatterParticles.filter(particle => particle.life > 0.06);
            processingCtx.restore();
        }

        function getShatterPoint(event) {
            const dpr = window.devicePixelRatio || 1;
            const rect = processingCanvas.getBoundingClientRect();
            return {
                x: (event.clientX - rect.left) * dpr,
                y: (event.clientY - rect.top) * dpr
            };
        }

        function handleShatterPointerDown(event) {
            if (activeEntry !== '004') return;
            shatterPointerDownX = event.clientX;
            shatterPointerDownY = event.clientY;
            shatterPointerMoved = false;
            processingCanvas.setPointerCapture(event.pointerId);
        }

        function handleShatterPointerMove(event) {
            if (activeEntry !== '004') return;
            const dx = event.clientX - shatterPointerDownX;
            const dy = event.clientY - shatterPointerDownY;
            if (event.buttons === 1 && Math.hypot(dx, dy) > 5) {
                shatterPointerMoved = true;
            }

            const point = getShatterPoint(event);
            createShatterBurst(point.x, point.y, event.buttons === 1 ? 72 : 22);
        }

        function handleShatterPointerUp(event) {
            if (activeEntry !== '004') return;
            processingCanvas.releasePointerCapture(event.pointerId);
            if (!shatterPointerMoved) {
                prepareShatter(true);
            }
        }

        async function prepareAdditiveRemix(randomize = false) {
            remixImageIndex = randomize ? randomImageIndex(remixImageIndex) : currentImageIndex;
            setVisibleBackground(remixImageIndex);
            processingCtx.clearRect(0, 0, processingCanvas.width, processingCanvas.height);
            const sourceIndexes = [];
            while (sourceIndexes.length < Math.min(4, IMAGES.length)) {
                const index = randomImageIndex(sourceIndexes[sourceIndexes.length - 1] ?? remixImageIndex);
                if (index !== remixImageIndex && !sourceIndexes.includes(index)) {
                    sourceIndexes.push(index);
                }
            }
            remixSources = await Promise.all(sourceIndexes.map(index => loadImage(IMAGES[index])));
            seedAdditiveRemix();
        }

        function seedAdditiveRemix() {
            if (!remixSources.length) return;
            processingCtx.fillStyle = 'rgba(0, 0, 0, 0.78)';
            processingCtx.fillRect(0, 0, processingCanvas.width, processingCanvas.height);
            const dpr = window.devicePixelRatio || 1;
            const count = Math.floor((processingCanvas.width * processingCanvas.height) / (5800 * dpr * dpr));
            for (let i = 0; i < count; i++) {
                drawRemixSample(
                    Math.random() * processingCanvas.width,
                    Math.random() * processingCanvas.height,
                    0.55 + Math.random() * 0.75
                );
            }
        }

        function drawRemixSample(x, y, strength = 1) {
            if (activeEntry !== '005' || !remixSources.length) return;
            const dpr = window.devicePixelRatio || 1;
            const image = remixSources[Math.floor(Math.random() * remixSources.length)];
            const cover = getCoverRect(processingCanvas, image);
            const sourceX = ((x - cover.x) / cover.width) * image.naturalWidth + (Math.random() - 0.5) * 320;
            const sourceY = ((y - cover.y) / cover.height) * image.naturalHeight + (Math.random() - 0.5) * 320;
            const sourceSize = 34 + Math.random() * 140;
            const radius = (13 + Math.random() * 39) * dpr * strength;
            const rotation = (Math.random() - 0.5) * Math.PI;

            processingCtx.save();
            processingCtx.translate(x, y);
            processingCtx.rotate(rotation);

            processingCtx.globalCompositeOperation = 'source-over';
            processingCtx.globalAlpha = 0.45;
            processingCtx.fillStyle = 'rgba(0, 0, 0, 0.9)';
            processingCtx.beginPath();
            processingCtx.arc(radius * 0.13, radius * 0.18, radius * 1.04, 0, Math.PI * 2);
            processingCtx.fill();

            processingCtx.beginPath();
            processingCtx.arc(0, 0, radius, 0, Math.PI * 2);
            processingCtx.clip();
            processingCtx.globalAlpha = 0.74 + Math.random() * 0.26;
            processingCtx.globalCompositeOperation = 'source-over';
            processingCtx.filter = `saturate(${1.25 + Math.random() * 2.4}) contrast(${1.04 + Math.random() * 0.8}) brightness(${0.9 + Math.random() * 0.35})`;
            processingCtx.drawImage(
                image,
                Math.max(0, Math.min(image.naturalWidth - sourceSize, sourceX)),
                Math.max(0, Math.min(image.naturalHeight - sourceSize, sourceY)),
                sourceSize,
                sourceSize,
                -radius,
                -radius,
                radius * 2,
                radius * 2
            );

            if (Math.random() > 0.42) {
                processingCtx.globalAlpha = 0.22 + Math.random() * 0.28;
                processingCtx.globalCompositeOperation = 'screen';
                const gradient = processingCtx.createRadialGradient(
                    -radius * 0.45,
                    -radius * 0.45,
                    radius * 0.05,
                    0,
                    0,
                    radius
                );
                gradient.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
                gradient.addColorStop(0.44, Math.random() > 0.5 ? 'rgba(0, 220, 255, 0.55)' : 'rgba(255, 46, 141, 0.55)');
                gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                processingCtx.fillStyle = gradient;
                processingCtx.fillRect(-radius, -radius, radius * 2, radius * 2);
            }

            processingCtx.globalAlpha = 0.28;
            processingCtx.globalCompositeOperation = 'source-over';
            processingCtx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
            processingCtx.lineWidth = Math.max(1, radius * 0.055);
            processingCtx.beginPath();
            processingCtx.arc(0, 0, radius - processingCtx.lineWidth * 0.5, 0, Math.PI * 2);
            processingCtx.stroke();
            processingCtx.restore();
        }

        function handleRemixPointerDown(event) {
            if (activeEntry !== '005') return;
            remixPointerDownX = event.clientX;
            remixPointerDownY = event.clientY;
            remixPointerMoved = false;
            processingCanvas.setPointerCapture(event.pointerId);
        }

        function handleRemixPointerMove(event) {
            if (activeEntry !== '005') return;
            const dpr = window.devicePixelRatio || 1;
            const dx = event.clientX - remixPointerDownX;
            const dy = event.clientY - remixPointerDownY;
            if (event.buttons === 1 && Math.hypot(dx, dy) > 5) {
                remixPointerMoved = true;
            }
            const rect = processingCanvas.getBoundingClientRect();
            const x = (event.clientX - rect.left) * dpr;
            const y = (event.clientY - rect.top) * dpr;
            const repeats = event.buttons === 1 ? 10 : 5;
            for (let i = 0; i < repeats; i++) {
                drawRemixSample(
                    x + (Math.random() - 0.5) * 170 * dpr,
                    y + (Math.random() - 0.5) * 170 * dpr,
                    event.buttons === 1 ? 0.92 : 0.62
                );
            }
        }

        function handleRemixPointerUp(event) {
            if (activeEntry !== '005') return;
            processingCanvas.releasePointerCapture(event.pointerId);
            if (!remixPointerMoved) {
                prepareAdditiveRemix(true);
            }
        }

        function handleRevealPointerDown(event) {
            revealPointerDownX = event.clientX;
            revealPointerDownY = event.clientY;
            revealPointerMoved = false;
            revealCanvas.setPointerCapture(event.pointerId);
        }

        function handleRevealPointerMove(event) {
            if (activeEntry !== '002') return;
            const dx = event.clientX - revealPointerDownX;
            const dy = event.clientY - revealPointerDownY;
            if (event.buttons !== 1) {
                paintPixelReveal(event);
                return;
            }
            if (Math.hypot(dx, dy) > 3) {
                revealPointerMoved = true;
                paintPixelReveal(event);
            }
        }

        function handleRevealPointerUp(event) {
            if (activeEntry !== '002') return;
            if (!revealPointerMoved) {
                prepareRevealStack(true);
                playRandomAudioTrack();
            }
        }

        function pseudoNoise(x, y, t) {
            return (
                Math.sin(x * 0.018 + t) +
                Math.sin(y * 0.022 - t * 0.72) +
                Math.sin((x + y) * 0.012 + t * 0.41)
            ) / 3;
        }

        function startPerlinNoiseSlider() {
            if (processingAnimationId) cancelAnimationFrame(processingAnimationId);
            processingTime = 0;
            const tick = () => {
                if (activeEntry !== '006') {
                    processingAnimationId = null;
                    return;
                }
                processingTime += 0.012 + processingPointerY * 0.026;
                renderPerlinNoiseSlider();
                processingAnimationId = requestAnimationFrame(tick);
            };
            tick();
        }

        function renderPerlinNoiseSlider() {
            const width = processingCanvas.width;
            const height = processingCanvas.height;
            const dpr = window.devicePixelRatio || 1;
            const spacing = (22 + processingPointerX * 46) * dpr;
            const strokeScale = 0.65 + processingPointerY * 1.8;

            processingCtx.clearRect(0, 0, width, height);
            processingCtx.fillStyle = 'rgba(0, 0, 0, 0.28)';
            processingCtx.fillRect(0, 0, width, height);
            processingCtx.lineCap = 'round';

            for (let y = -spacing; y < height + spacing; y += spacing) {
                processingCtx.beginPath();
                for (let x = -spacing; x < width + spacing; x += spacing * 0.42) {
                    const n = pseudoNoise(x, y, processingTime);
                    const wave = n * spacing * (1.4 + processingPointerY * 2.4);
                    const px = x;
                    const py = y + wave;
                    if (x === -spacing) {
                        processingCtx.moveTo(px, py);
                    } else {
                        processingCtx.lineTo(px, py);
                    }
                }
                const hue = 205 + Math.sin(y * 0.006 + processingTime) * 54;
                processingCtx.strokeStyle = `hsla(${hue}, 88%, ${58 + processingPointerY * 22}%, 0.34)`;
                processingCtx.lineWidth = Math.max(1, strokeScale * dpr);
                processingCtx.stroke();
            }

            for (let i = 0; i < 90; i++) {
                const x = (Math.sin(i * 91.7 + processingTime * 0.7) * 0.5 + 0.5) * width;
                const y = (Math.sin(i * 41.3 - processingTime * 0.52) * 0.5 + 0.5) * height;
                const r = (1.5 + pseudoNoise(x, y, processingTime) * 3 + processingPointerX * 5) * dpr;
                processingCtx.fillStyle = `rgba(255, 245, 160, ${0.08 + processingPointerY * 0.14})`;
                processingCtx.beginPath();
                processingCtx.arc(x, y, Math.max(0.8, r), 0, Math.PI * 2);
                processingCtx.fill();
            }
        }

        function updateProcessingPointer(event) {
            if (activeEntry !== '006') return;
            const rect = processingCanvas.getBoundingClientRect();
            processingPointerX = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
            processingPointerY = Math.min(1, Math.max(0, (event.clientY - rect.top) / rect.height));
        }

        function clearInteractiveLayers() {
            revealUnderCanvas.classList.remove('active');
            revealCanvas.classList.remove('active');
            circleMaskCanvas.classList.remove('active');
            processingCanvas.classList.remove('active');
            revealCtx.clearRect(0, 0, revealCanvas.width, revealCanvas.height);
            revealUnderCtx.clearRect(0, 0, revealUnderCanvas.width, revealUnderCanvas.height);
            circleMaskCtx.clearRect(0, 0, circleMaskCanvas.width, circleMaskCanvas.height);
            processingCtx.clearRect(0, 0, processingCanvas.width, processingCanvas.height);
            revealReady = false;
            if (circleAnimationId) cancelAnimationFrame(circleAnimationId);
            circleAnimationId = null;
            if (processingAnimationId) cancelAnimationFrame(processingAnimationId);
            processingAnimationId = null;
            if (shatterAnimationId) cancelAnimationFrame(shatterAnimationId);
            shatterAnimationId = null;
            shatterParticles = [];
            if (glitchFadeAnimationId) cancelAnimationFrame(glitchFadeAnimationId);
            glitchFadeAnimationId = null;
            glitchPointerDown = false;
        }

        function switchEntry(entry, randomize = false) {
            activeEntry = entry;
            document.body.classList.toggle('entry-001', entry === '001');
            document.body.classList.toggle('entry-002', entry === '002');
            document.body.classList.toggle('entry-003', entry === '003');
            document.body.classList.toggle('entry-004', entry === '004');
            document.body.classList.toggle('entry-005', entry === '005');
            journalDots.forEach(dot => dot.classList.toggle('active', dot.dataset.entry === entry));
            showSketchLoader();

            if (entry === '002') {
                clearInteractiveLayers();
                revealUnderCanvas.classList.add('active');
                revealCanvas.classList.add('active');
                revealCycleIndex = currentImageIndex;
                prepareRevealStack(randomize);
            } else if (entry === '003') {
                clearInteractiveLayers();
                circleMaskCanvas.classList.add('active');
                prepareCircleMasks(randomize);
            } else if (entry === '006') {
                clearInteractiveLayers();
                processingCanvas.classList.add('active');
                startPerlinNoiseSlider();
            } else if (entry === '001') {
                clearInteractiveLayers();
                processingCanvas.classList.add('active');
                transitionImage();
                startGlitchFade();
            } else if (entry === '004') {
                clearInteractiveLayers();
                processingCanvas.classList.add('active');
                prepareShatter(randomize);
            } else if (entry === '005') {
                clearInteractiveLayers();
                processingCanvas.classList.add('active');
                prepareAdditiveRemix(randomize);
            } else {
                clearInteractiveLayers();
                transitionImage();
            }
        }

        // Web Audio Mixing Engine
        async function playRandomAudioTrack() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                // Set up baseline Master volume gain routing
                masterGainNode = audioCtx.createGain();
                masterGainNode.connect(audioCtx.destination);
                masterGainNode.gain.value = parseFloat(volumeSlider.value);
            }

            if (AUDIO_TRACKS.length === 0) return;
            let randomTrackIndex = Math.floor(Math.random() * AUDIO_TRACKS.length);
            if (AUDIO_TRACKS.length > 1) {
                while (randomTrackIndex === currentTrackIndex) {
                    randomTrackIndex = Math.floor(Math.random() * AUDIO_TRACKS.length);
                }
            }
            const trackUrl = AUDIO_TRACKS[randomTrackIndex];
            
            try {
                const response = await fetch(trackUrl);
                const arrayBuffer = await response.arrayBuffer();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

                const newSourceNode = audioCtx.createBufferSource();
                newSourceNode.buffer = audioBuffer;

                const newTrackGainNode = audioCtx.createGain();
                newTrackGainNode.gain.setValueAtTime(0, audioCtx.currentTime); // Start track completely silent

                // Route: Individual Source Audio Track Node -> Dynamic Volume Mixer -> Final Audio Driver output
                newSourceNode.connect(newTrackGainNode);
                newTrackGainNode.connect(masterGainNode);

                const now = audioCtx.currentTime;

                // Seamlessly crossfade active tracks
                if (currentTrackGainNode && currentSourceNode) {
                    const oldGain = currentTrackGainNode;
                    const oldSource = currentSourceNode;
                    
                    oldGain.gain.setValueAtTime(oldGain.gain.value, now);
                    oldGain.gain.linearRampToValueAtTime(0, now + FADE_DURATION);
                    
                    setTimeout(() => {
                        try { oldSource.stop(); } catch(e) {}
                    }, FADE_DURATION * 1000);
                }

                newSourceNode.start(now);
                newTrackGainNode.gain.linearRampToValueAtTime(1, now + FADE_DURATION);

                currentSourceNode = newSourceNode;
                currentTrackGainNode = newTrackGainNode;
                currentTrackIndex = randomTrackIndex;
                currentTrackStartedAt = now;
                currentTrackDuration = audioBuffer.duration;
                currentTrackLabel = AUDIO_LABELS[trackUrl] || trackUrl.split('/').pop();

                newSourceNode.onended = () => {
                    if (currentSourceNode === newSourceNode) {
                        handleTrackEnded();
                    }
                };

            } catch (error) {
                console.error("Audio target skipped or execution stalled. Verify hosting permissions:", error);
            }
        }

        function triggerNextCycle() {
            transitionImage();
            if (SKETCH_AUDIO_MODE[activeEntry] === 'ambient-cycle') {
                playRandomAudioTrack();
            }
        }

        function handleTrackEnded() {
            if (activeEntry === '001') {
                transitionImage();
            }
            playRandomAudioTrack();
        }

        function resetCurrentExperience() {
            if (activeEntry === '002') {
                prepareRevealStack(true);
            } else if (activeEntry === '003') {
                prepareCircleMasks(true);
            } else if (activeEntry === '004') {
                prepareShatter(true);
            } else if (activeEntry === '005') {
                prepareAdditiveRemix(true);
            } else {
                transitionImage();
            }
            playRandomAudioTrack();
        }

        // Action Trigger Listeners
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('setup-overlay').style.opacity = '0';
            setTimeout(() => document.getElementById('setup-overlay').style.display = 'none', 500);
            
            document.getElementById('ui-panel').classList.add('visible');
            processingCanvas.classList.add('active');
            startGlitchFade();
            showSketchLoader();
            
            triggerNextCycle();
            setInterval(() => {
                if (activeEntry === '001') transitionImage();
            }, 12000); // Entry 001 transitions a new photo mix every 12 seconds independently
        });

        document.getElementById('next-btn').addEventListener('click', resetCurrentExperience);

        journalDots.forEach(dot => {
            dot.addEventListener('click', () => {
                switchEntry(dot.dataset.entry, true);
                playRandomAudioTrack();
            });
        });

        revealCanvas.addEventListener('pointerdown', handleRevealPointerDown);
        revealCanvas.addEventListener('pointermove', handleRevealPointerMove);
        revealCanvas.addEventListener('pointerup', handleRevealPointerUp);
        circleMaskCanvas.addEventListener('pointerdown', handleCirclePointerDown);
        processingCanvas.addEventListener('pointermove', updateProcessingPointer);
        processingCanvas.addEventListener('pointerdown', updateProcessingPointer);
        processingCanvas.addEventListener('pointermove', handleGlitchPointerMove);
        processingCanvas.addEventListener('pointerdown', handleGlitchPointerDown);
        processingCanvas.addEventListener('pointerup', handleGlitchPointerUp);
        processingCanvas.addEventListener('pointercancel', handleGlitchPointerUp);
        processingCanvas.addEventListener('pointerdown', handleShatterPointerDown);
        processingCanvas.addEventListener('pointermove', handleShatterPointerMove);
        processingCanvas.addEventListener('pointerup', handleShatterPointerUp);
        processingCanvas.addEventListener('pointercancel', handleShatterPointerUp);
        processingCanvas.addEventListener('pointerdown', handleRemixPointerDown);
        processingCanvas.addEventListener('pointermove', handleRemixPointerMove);
        processingCanvas.addEventListener('pointerup', handleRemixPointerUp);
        processingCanvas.addEventListener('pointercancel', handleRemixPointerUp);
        window.addEventListener('resize', resizeRevealCanvas);
        resizeRevealCanvas();
        updateAudioReadout();

        // Sound Engine Value Controllers
        const volumeSlider = document.getElementById('volume-slider');
        const muteBtn = document.getElementById('mute-btn');

        volumeSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            if (masterGainNode) masterGainNode.gain.value = val;
            
            if (val === 0) {
                isMuted = true;
                muteBtn.textContent = 'muted';
            } else {
                isMuted = false;
                muteBtn.textContent = 'sound';
            }
        });

        muteBtn.addEventListener('click', () => {
            if (!masterGainNode) return;

            if (!isMuted) {
                preMuteVolume = parseFloat(volumeSlider.value);
                masterGainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                volumeSlider.value = 0;
                muteBtn.textContent = 'muted';
                isMuted = true;
            } else {
                masterGainNode.gain.setValueAtTime(preMuteVolume, audioCtx.currentTime);
                volumeSlider.value = preMuteVolume;
                muteBtn.textContent = 'sound';
                isMuted = false;
            }
        });
    </script>
</body>
</html>
