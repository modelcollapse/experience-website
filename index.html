<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experience Journal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #000;
        }
        /* Fullscreen Photo Layers */
        #bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .bg-slide {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transform: scale(1);
            filter: none;
            transition: opacity 8s ease-in-out;
            will-change: opacity;
        }
        .bg-slide.active {
            opacity: 1;
            filter: none;
            transform: scale(1);
        }
        .bg-slide.drift-a.active {
            background-position: center;
            transform: scale(1);
        }
        .bg-slide.drift-b.active {
            background-position: center;
            transform: scale(1);
        }
        .bg-slide.drift-c.active {
            background-position: center;
            transform: scale(1);
        }
        #atmosphere-overlay {
            display: none;
        }
        #processing-canvas,
        #circle-mask-canvas,
        #reveal-under-canvas,
        #reveal-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            cursor: crosshair;
            touch-action: none;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        #reveal-under-canvas {
            z-index: 1;
        }
        #reveal-canvas {
            z-index: 2;
        }
        #circle-mask-canvas {
            z-index: 2;
        }
        #processing-canvas {
            z-index: 2;
        }
        #reveal-canvas.refreshing {
            animation: revealSurfaceIn 6s ease both;
        }
        #reveal-under-canvas.active,
        #reveal-canvas.active,
        #circle-mask-canvas.active,
        #processing-canvas.active {
            opacity: 1;
            visibility: visible;
        }
        @keyframes revealSurfaceIn {
            0% {
                opacity: 0;
                filter: blur(18px) brightness(1.3);
            }
            100% {
                opacity: 1;
                filter: blur(0) brightness(1);
            }
        }

        /* Initial Unlock Overlay */
        #setup-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        #start-btn {
            padding: 15px 40px;
            font-size: 1.1rem;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(255,255,255,0.1);
            transition: all 0.2s ease;
        }
        #start-btn:hover {
            transform: scale(1.03);
            background: #e5e5e5;
        }

        /* Minimal Top-Left Control Panel */
        #control-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 3;
            display: grid;
            grid-template-columns: auto auto auto;
            align-items: center;
            gap: 8px 14px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #control-panel.visible {
            opacity: 1;
            visibility: visible;
        }
        #journal-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 3;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #journal-panel.visible {
            opacity: 1;
            visibility: visible;
        }
        #audio-readout {
            grid-column: 1 / -1;
            min-width: 220px;
            max-width: min(360px, calc(100vw - 64px));
            color: rgba(255, 255, 255, 0.84);
            font-size: 0.72rem;
            line-height: 1.25;
            font-weight: 600;
        }
        #track-name {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #track-time {
            display: block;
            margin-top: 2px;
            color: rgba(255, 255, 255, 0.58);
            font-variant-numeric: tabular-nums;
        }
        #journal-select {
            min-width: min(330px, calc(100vw - 64px));
            height: 34px;
            padding: 0 36px 0 12px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 650;
            letter-spacing: 0;
        }
        #journal-select option {
            color: #000;
        }
        #sketch-loader {
            position: absolute;
            inset: 0;
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            background: rgba(0, 0, 0, 0.46);
            color: #fff;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        #sketch-loader.visible {
            opacity: 1;
            visibility: visible;
        }
        #sketch-loader-content {
            width: min(220px, 54vw);
            height: 3px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.14);
            border-radius: 999px;
        }
        #sketch-loader-content::after {
            content: "";
            display: block;
            width: 42%;
            height: 100%;
            background: rgba(255, 255, 255, 0.84);
            border-radius: inherit;
            animation: loadingBar 1.05s ease-in-out infinite;
        }
        @keyframes loadingBar {
            0% { transform: translateX(-105%); }
            100% { transform: translateX(245%); }
        }
        @media (max-width: 520px) {
            #control-panel {
                left: 12px;
                bottom: 12px;
                gap: 10px;
                padding: 9px 12px;
            }
            #journal-panel {
                top: 12px;
                left: 12px;
            }
            input[type="range"] {
                width: 64px;
            }
        }

        /* Control Panel Elements */
        .ctrl-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.8;
            transition: opacity 0.2s;
            width: 28px;
            height: 28px;
        }
        .ctrl-btn:hover {
            opacity: 1;
        }
        
        /* Volume Container & Slider Styling */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body class="entry-001">

    <!-- Fullscreen Image Layer -->
    <div id="bg-container"></div>
    <div id="atmosphere-overlay" aria-hidden="true"></div>
    <canvas id="reveal-under-canvas" aria-hidden="true"></canvas>
    <canvas id="reveal-canvas" aria-label="Pixel reveal canvas"></canvas>
    <canvas id="circle-mask-canvas" aria-label="Concentric image mask canvas"></canvas>
    <canvas id="processing-canvas" aria-label="Processing sketch canvas"></canvas>

    <!-- Initial Unlock Overlay -->
    <div id="setup-overlay">
        <button id="start-btn">Enter Experience</button>
    </div>
    <div id="sketch-loader" aria-live="polite">
        <div id="sketch-loader-content"></div>
    </div>

    <!-- Minimal Floating Top-Left UI -->
    <div id="control-panel">
        <button id="mute-btn" class="ctrl-btn" title="Mute/Unmute">🔊</button>
        <div class="volume-container">
            <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="1">
        </div>
        <button id="next-btn" class="ctrl-btn" title="Next Mix">⏭️</button>
        <div id="audio-readout" aria-live="polite">
            <span id="track-name">No audio playing</span>
            <span id="track-time">00:00 / 00:00</span>
        </div>
    </div>
    <div id="journal-panel" aria-label="Experience journal">
        <select id="journal-select" aria-label="Select experience">
            <option value="001">001 Fade</option>
            <option value="002">002 Pixel Reveal</option>
            <option value="003">003 Concentric Masks</option>
        </select>
    </div>

    <script>
        // ASSETS CONFIGURATION: Swap these placeholders with your actual server file paths!
        const IMAGES = [
            "assets/images/dsc-0008.jpg",
            "assets/images/dsc-0009.jpg",
            "assets/images/dsc-0010.jpg",
            "assets/images/dsc-0025.jpg",
            "assets/images/dsc-0032.jpg",
            "assets/images/dsc-0033.jpg",
            "assets/images/dsc-0039.jpg",
            "assets/images/dsc-0037.jpg",
            "assets/images/dsc-0042.jpg"
        ];

        const AUDIO_TRACKS = [
            "assets/audio/birds.mp3",
            "assets/audio/walking-sounds-2.mp3",
            "assets/audio/walking-sounds.mp3",
            "assets/audio/slow-walking-sounds.mp3",
            "assets/audio/night-sounds.mp3",
            "assets/audio/morning-sounds-2026-09-15.mp3"
        ];

        const AUDIO_LABELS = {
            "assets/audio/birds.mp3": "Birds",
            "assets/audio/walking-sounds-2.mp3": "Walking Sounds 2",
            "assets/audio/walking-sounds.mp3": "Walking Sounds",
            "assets/audio/slow-walking-sounds.mp3": "Slow Walking Sounds",
            "assets/audio/night-sounds.mp3": "Night Sounds",
            "assets/audio/morning-sounds-2026-09-15.mp3": "Morning Sounds 9-15-2026"
        };

        const SKETCH_AUDIO_MODE = {
            "001": "ambient-cycle",
            "002": "hold",
            "003": "hold",
            "004": "hold",
            "005": "hold",
            "006": "hold",
            "007": "hold",
            "008": "hold",
            "009": "hold",
            "010": "hold",
            "011": "hold",
            "012": "hold",
            "013": "hold",
            "014": "hold",
            "015": "hold",
            "016": "hold",
            "017": "hold",
            "018": "hold",
            "019": "hold"
        };

        const SKETCH_LABELS = {
            "001": "Fade",
            "002": "Pixel Reveal",
            "003": "Concentric Masks",
            "004": "Placeholder",
            "005": "p5Catalyst",
            "006": "PerlinNoiseSlider",
            "007": "ScanLines",
            "008": "TrailingCircle",
            "009": "CirclePatternSketch",
            "010": "CircleLine",
            "011": "imageslice",
            "012": "dot-connect",
            "013": "Wander-Web",
            "014": "GradientNodes",
            "015": "GradientDrag",
            "016": "ColorPills",
            "017": "AntiGravity_001",
            "018": "midi-experiments",
            "019": "digital-nature"
        };

        // Core Systems Configuration
        let audioCtx;
        let masterGainNode; // Parent master volume slider tracking node
        let currentSourceNode = null;
        let currentTrackGainNode = null;
        let currentTrackIndex = -1;
        let currentTrackStartedAt = 0;
        let currentTrackDuration = 0;
        let currentTrackLabel = 'No audio playing';
        
        let isMuted = false;
        let preMuteVolume = 1;
        let activeEntry = '001';
        let currentImageIndex = 0;
        let revealImageStack = [];
        let revealTopImage = null;
        let revealReady = false;
        let revealCycleIndex = 0;
        let revealBrushCount = 0;
        let revealMiddleActive = false;
        let circleImage = null;
        let previousCircleImage = null;
        let circleFadeStart = 0;
        let circleImageIndex = 0;
        let circlePointerX = 0;
        let circlePointerY = 0;
        let circleTargetX = 0;
        let circleTargetY = 0;
        let circleSpin = 0;
        let circleSpinTarget = 0;
        let circleAnimationId = null;
        let processingAnimationId = null;
        let processingPointerX = 0.5;
        let processingPointerY = 0.5;
        let processingTime = 0;
        let loaderTimeout = null;
        const FADE_DURATION = 4.0; // Audio crossfade overlap length (seconds)
        const DRIFT_CLASSES = ['drift-a', 'drift-b', 'drift-c'];

        // Inject background elements into standard browser template DOM
        const bgContainer = document.getElementById('bg-container');
        IMAGES.forEach((src, idx) => {
            const div = document.createElement('div');
            div.className = 'bg-slide';
            div.style.backgroundImage = `url('${src}')`;
            if (idx === 0) div.classList.add('active');
            bgContainer.appendChild(div);
        });

        const revealCanvas = document.getElementById('reveal-canvas');
        const revealUnderCanvas = document.getElementById('reveal-under-canvas');
        const circleMaskCanvas = document.getElementById('circle-mask-canvas');
        const processingCanvas = document.getElementById('processing-canvas');
        const revealCtx = revealCanvas.getContext('2d', { alpha: true });
        const revealUnderCtx = revealUnderCanvas.getContext('2d', { alpha: true });
        const circleMaskCtx = circleMaskCanvas.getContext('2d', { alpha: true });
        const processingCtx = processingCanvas.getContext('2d', { alpha: true });
        const sketchLoader = document.getElementById('sketch-loader');
        const journalSelect = document.getElementById('journal-select');
        const trackName = document.getElementById('track-name');
        const trackTime = document.getElementById('track-time');

        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = src;
            });
        }

        function drawImageCover(ctx, canvas, img) {
            const canvasRatio = canvas.width / canvas.height;
            const imageRatio = img.naturalWidth / img.naturalHeight;
            let width = canvas.width;
            let height = canvas.height;
            let x = 0;
            let y = 0;

            if (imageRatio > canvasRatio) {
                height = canvas.height;
                width = height * imageRatio;
                x = (canvas.width - width) / 2;
            } else {
                width = canvas.width;
                height = width / imageRatio;
                y = (canvas.height - height) / 2;
            }

            ctx.drawImage(img, x, y, width, height);
        }

        function resizeRevealCanvas() {
            const dpr = window.devicePixelRatio || 1;
            revealCanvas.width = Math.floor(window.innerWidth * dpr);
            revealCanvas.height = Math.floor(window.innerHeight * dpr);
            revealUnderCanvas.width = revealCanvas.width;
            revealUnderCanvas.height = revealCanvas.height;
            circleMaskCanvas.width = revealCanvas.width;
            circleMaskCanvas.height = revealCanvas.height;
            processingCanvas.width = revealCanvas.width;
            processingCanvas.height = revealCanvas.height;
            revealCanvas.style.width = `${window.innerWidth}px`;
            revealCanvas.style.height = `${window.innerHeight}px`;
            revealUnderCanvas.style.width = revealCanvas.style.width;
            revealUnderCanvas.style.height = revealCanvas.style.height;
            circleMaskCanvas.style.width = revealCanvas.style.width;
            circleMaskCanvas.style.height = revealCanvas.style.height;
            processingCanvas.style.width = revealCanvas.style.width;
            processingCanvas.style.height = revealCanvas.style.height;
            if (activeEntry === '002' && revealReady) {
                renderRevealStack();
            }
            if (activeEntry === '003' && circleImage) {
                renderCircleMasks();
            }
            if (activeEntry === '006') {
                renderPerlinNoiseSlider();
            }
        }

        function setVisibleBackground(index) {
            const slides = document.querySelectorAll('.bg-slide');
            slides.forEach(slide => slide.classList.remove('active', ...DRIFT_CLASSES));
            if (slides[index]) {
                const driftClass = DRIFT_CLASSES[Math.floor(Math.random() * DRIFT_CLASSES.length)];
                slides[index].classList.add('active', driftClass);
            }
            currentImageIndex = index;
        }

        function transitionImage() {
            const slides = document.querySelectorAll('.bg-slide');
            if (slides.length === 0) return;
            const randomIndex = Math.floor(Math.random() * slides.length);
            setVisibleBackground(randomIndex);
        }

        function formatTime(seconds) {
            if (!Number.isFinite(seconds) || seconds < 0) return '00:00';
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);
            return `${String(minutes).padStart(2, '0')}:${String(remainingSeconds).padStart(2, '0')}`;
        }

        function updateAudioReadout() {
            let elapsed = 0;
            if (audioCtx && currentTrackDuration > 0) {
                elapsed = Math.min(currentTrackDuration, Math.max(0, audioCtx.currentTime - currentTrackStartedAt));
            }
            trackName.textContent = currentTrackLabel;
            trackTime.textContent = `${formatTime(elapsed)} / ${formatTime(currentTrackDuration)}`;
            requestAnimationFrame(updateAudioReadout);
        }

        async function prepareRevealStack(advance = false) {
            if (advance) {
                revealCycleIndex = (revealCycleIndex + 1) % IMAGES.length;
            } else {
                revealCycleIndex = currentImageIndex;
            }
            const startIndex = revealCycleIndex;
            const imageIndexes = [0, 1, 2].map(offset => (startIndex + offset) % IMAGES.length);
            setVisibleBackground(imageIndexes[0]);

            try {
                const loadedImages = await Promise.all(imageIndexes.map(idx => loadImage(IMAGES[idx])));
                revealImageStack = loadedImages;
                revealTopImage = loadedImages[2];
                revealBrushCount = 0;
                revealMiddleActive = false;
                revealReady = true;
                renderRevealStack();
                animateNewRevealSurface();
            } catch (error) {
                revealReady = false;
                console.error('Reveal images could not be prepared:', error);
            }
        }

        function renderRevealStack() {
            revealUnderCtx.globalCompositeOperation = 'source-over';
            revealUnderCtx.clearRect(0, 0, revealUnderCanvas.width, revealUnderCanvas.height);
            revealUnderCtx.globalAlpha = 1;
            drawImageCover(revealUnderCtx, revealUnderCanvas, revealImageStack[1]);
            revealUnderCtx.globalAlpha = 1;

            revealCtx.globalCompositeOperation = 'source-over';
            revealCtx.clearRect(0, 0, revealCanvas.width, revealCanvas.height);
            drawImageCover(revealCtx, revealCanvas, revealTopImage);
        }

        function animateNewRevealSurface() {
            revealCanvas.classList.remove('refreshing');
            void revealCanvas.offsetWidth;
            revealCanvas.classList.add('refreshing');
        }

        function paintPixelReveal(event) {
            if (activeEntry !== '002' || !revealReady) return;
            const rect = revealCanvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            const pressure = event.pressure && event.pressure > 0 ? event.pressure : 0.5;
            const brushRadius = (46 + pressure * 82) * dpr;
            const x = (event.clientX - rect.left) * dpr;
            const y = (event.clientY - rect.top) * dpr;
            const dots = 16 + Math.floor(pressure * 16);

            revealCtx.globalCompositeOperation = 'destination-out';
            if (revealMiddleActive) {
                revealUnderCtx.globalCompositeOperation = 'destination-out';
            }
            for (let i = 0; i < dots; i++) {
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.sqrt(Math.random()) * brushRadius;
                const dotX = x + Math.cos(angle) * distance;
                const dotY = y + Math.sin(angle) * distance;
                const falloff = 1 - distance / brushRadius;
                const radius = (4 + Math.random() * 18) * dpr * (0.5 + falloff * 0.7);
                revealCtx.globalAlpha = 0.24 + falloff * 0.34;
                revealCtx.beginPath();
                revealCtx.arc(dotX, dotY, radius, 0, Math.PI * 2);
                revealCtx.fill();

                if (revealMiddleActive && Math.random() < 0.74) {
                    revealUnderCtx.globalAlpha = 0.12 + falloff * 0.24;
                    revealUnderCtx.beginPath();
                    revealUnderCtx.arc(dotX, dotY, radius * (0.7 + Math.random() * 0.7), 0, Math.PI * 2);
                    revealUnderCtx.fill();
                }
            }
            revealCtx.globalAlpha = 1;
            revealUnderCtx.globalAlpha = 1;
            revealUnderCtx.globalCompositeOperation = 'source-over';
            revealBrushCount += 1;
            if (revealBrushCount > 18) revealMiddleActive = true;
        }

        function showSketchLoader() {
            sketchLoader.classList.add('visible');
            clearTimeout(loaderTimeout);
            loaderTimeout = setTimeout(() => {
                sketchLoader.classList.remove('visible');
            }, 1150);
        }

        async function prepareCircleMasks(advance = false) {
            const baseIndex = advance ? (circleImageIndex + 1) % IMAGES.length : currentImageIndex;
            circleImageIndex = baseIndex;
            const overlayIndex = advance && IMAGES.length > 1
                ? (baseIndex + 1 + Math.floor(Math.random() * (IMAGES.length - 1))) % IMAGES.length
                : baseIndex;
            setVisibleBackground(baseIndex);
            try {
                const loadedImage = await loadImage(IMAGES[overlayIndex]);
                previousCircleImage = circleImage;
                circleImage = loadedImage;
                circleFadeStart = performance.now();
                circlePointerX = 0;
                circlePointerY = 0;
                circleTargetX = 0;
                circleTargetY = 0;
                circleSpin = 0;
                circleSpinTarget = 0;
                startCircleAnimation();
            } catch (error) {
                console.error('Circle mask image could not be prepared:', error);
            }
        }

        function startCircleAnimation() {
            if (circleAnimationId) cancelAnimationFrame(circleAnimationId);
            const tick = () => {
                if (activeEntry !== '003') {
                    circleAnimationId = null;
                    return;
                }
                circlePointerX += (circleTargetX - circlePointerX) * 0.08;
                circlePointerY += (circleTargetY - circlePointerY) * 0.08;
                circleSpin += (circleSpinTarget - circleSpin) * 0.1;
                renderCircleMasks();
                circleAnimationId = requestAnimationFrame(tick);
            };
            tick();
        }

        function drawCircleImageBands(image, alpha) {
            if (!image || alpha <= 0) return;
            const width = circleMaskCanvas.width;
            const height = circleMaskCanvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const maxRadius = Math.hypot(width, height) * 0.58;
            const ringCount = 12;

            for (let i = ringCount; i >= 1; i--) {
                const radius = (maxRadius / ringCount) * i;
                const nextRadius = (maxRadius / ringCount) * (i - 0.52);
                const offsetStrength = (ringCount - i + 1) / ringCount;
                const offsetX = circlePointerX * offsetStrength * 66;
                const offsetY = circlePointerY * offsetStrength * 52;
                const rotation = circleSpin * (i % 2 === 0 ? 1 : -1) * (0.75 + offsetStrength * 2.2);
                const imageOffsetX = circlePointerX * offsetStrength * 32;
                const imageOffsetY = circlePointerY * offsetStrength * 26;

                circleMaskCtx.save();
                circleMaskCtx.translate(centerX + offsetX, centerY + offsetY);
                circleMaskCtx.rotate(rotation);
                circleMaskCtx.beginPath();
                circleMaskCtx.arc(0, 0, radius, 0, Math.PI * 2);
                if (nextRadius > 0) {
                    circleMaskCtx.arc(0, 0, nextRadius, 0, Math.PI * 2, true);
                }
                circleMaskCtx.clip('evenodd');
                circleMaskCtx.translate(-centerX - offsetX + imageOffsetX, -centerY - offsetY + imageOffsetY);
                circleMaskCtx.globalAlpha = alpha * (0.64 + offsetStrength * 0.28);
                circleMaskCtx.filter = `contrast(${1.04 + offsetStrength * 0.24}) saturate(${1.02 + offsetStrength * 0.22}) brightness(${1.02 + offsetStrength * 0.08})`;
                drawImageCover(circleMaskCtx, circleMaskCanvas, image);
                circleMaskCtx.restore();
            }
        }

        function renderCircleMasks() {
            if (!circleImage) return;
            const fadeProgress = Math.min(1, (performance.now() - circleFadeStart) / 1800);

            circleMaskCtx.clearRect(0, 0, circleMaskCanvas.width, circleMaskCanvas.height);
            drawCircleImageBands(previousCircleImage, 1 - fadeProgress);
            drawCircleImageBands(circleImage, fadeProgress);

            circleMaskCtx.globalAlpha = 1;
            circleMaskCtx.filter = 'none';
        }

        function updateCirclePointer(event) {
            if (activeEntry !== '003') return;
            const rect = circleMaskCanvas.getBoundingClientRect();
            circleTargetX = ((event.clientX - rect.left) / rect.width - 0.5) * 2;
            circleTargetY = ((event.clientY - rect.top) / rect.height - 0.5) * 2;
            circleSpinTarget = circleTargetX * Math.PI * 0.9 + circleTargetY * Math.PI * 0.45;
        }

        function pseudoNoise(x, y, t) {
            return (
                Math.sin(x * 0.018 + t) +
                Math.sin(y * 0.022 - t * 0.72) +
                Math.sin((x + y) * 0.012 + t * 0.41)
            ) / 3;
        }

        function startPerlinNoiseSlider() {
            if (processingAnimationId) cancelAnimationFrame(processingAnimationId);
            processingTime = 0;
            const tick = () => {
                if (activeEntry !== '006') {
                    processingAnimationId = null;
                    return;
                }
                processingTime += 0.012 + processingPointerY * 0.026;
                renderPerlinNoiseSlider();
                processingAnimationId = requestAnimationFrame(tick);
            };
            tick();
        }

        function renderPerlinNoiseSlider() {
            const width = processingCanvas.width;
            const height = processingCanvas.height;
            const dpr = window.devicePixelRatio || 1;
            const spacing = (22 + processingPointerX * 46) * dpr;
            const strokeScale = 0.65 + processingPointerY * 1.8;

            processingCtx.clearRect(0, 0, width, height);
            processingCtx.fillStyle = 'rgba(0, 0, 0, 0.28)';
            processingCtx.fillRect(0, 0, width, height);
            processingCtx.lineCap = 'round';

            for (let y = -spacing; y < height + spacing; y += spacing) {
                processingCtx.beginPath();
                for (let x = -spacing; x < width + spacing; x += spacing * 0.42) {
                    const n = pseudoNoise(x, y, processingTime);
                    const wave = n * spacing * (1.4 + processingPointerY * 2.4);
                    const px = x;
                    const py = y + wave;
                    if (x === -spacing) {
                        processingCtx.moveTo(px, py);
                    } else {
                        processingCtx.lineTo(px, py);
                    }
                }
                const hue = 205 + Math.sin(y * 0.006 + processingTime) * 54;
                processingCtx.strokeStyle = `hsla(${hue}, 88%, ${58 + processingPointerY * 22}%, 0.34)`;
                processingCtx.lineWidth = Math.max(1, strokeScale * dpr);
                processingCtx.stroke();
            }

            for (let i = 0; i < 90; i++) {
                const x = (Math.sin(i * 91.7 + processingTime * 0.7) * 0.5 + 0.5) * width;
                const y = (Math.sin(i * 41.3 - processingTime * 0.52) * 0.5 + 0.5) * height;
                const r = (1.5 + pseudoNoise(x, y, processingTime) * 3 + processingPointerX * 5) * dpr;
                processingCtx.fillStyle = `rgba(255, 245, 160, ${0.08 + processingPointerY * 0.14})`;
                processingCtx.beginPath();
                processingCtx.arc(x, y, Math.max(0.8, r), 0, Math.PI * 2);
                processingCtx.fill();
            }
        }

        function updateProcessingPointer(event) {
            if (activeEntry !== '006') return;
            const rect = processingCanvas.getBoundingClientRect();
            processingPointerX = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
            processingPointerY = Math.min(1, Math.max(0, (event.clientY - rect.top) / rect.height));
        }

        function clearInteractiveLayers() {
            revealUnderCanvas.classList.remove('active');
            revealCanvas.classList.remove('active');
            circleMaskCanvas.classList.remove('active');
            processingCanvas.classList.remove('active');
            revealCtx.clearRect(0, 0, revealCanvas.width, revealCanvas.height);
            revealUnderCtx.clearRect(0, 0, revealUnderCanvas.width, revealUnderCanvas.height);
            circleMaskCtx.clearRect(0, 0, circleMaskCanvas.width, circleMaskCanvas.height);
            processingCtx.clearRect(0, 0, processingCanvas.width, processingCanvas.height);
            revealReady = false;
            if (circleAnimationId) cancelAnimationFrame(circleAnimationId);
            circleAnimationId = null;
            if (processingAnimationId) cancelAnimationFrame(processingAnimationId);
            processingAnimationId = null;
        }

        function switchEntry(entry) {
            activeEntry = entry;
            document.body.classList.toggle('entry-001', entry === '001');
            document.body.classList.toggle('entry-002', entry === '002');
            document.body.classList.toggle('entry-003', entry === '003');
            document.body.classList.toggle('entry-004', entry === '004');
            if (journalSelect.value !== entry) journalSelect.value = entry;
            showSketchLoader();

            if (entry === '002') {
                clearInteractiveLayers();
                revealUnderCanvas.classList.add('active');
                revealCanvas.classList.add('active');
                revealCycleIndex = currentImageIndex;
                prepareRevealStack();
            } else if (entry === '003') {
                clearInteractiveLayers();
                circleMaskCanvas.classList.add('active');
                prepareCircleMasks();
            } else if (entry === '006') {
                clearInteractiveLayers();
                processingCanvas.classList.add('active');
                startPerlinNoiseSlider();
            } else {
                clearInteractiveLayers();
                transitionImage();
            }
        }

        // Web Audio Mixing Engine
        async function playRandomAudioTrack() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                // Set up baseline Master volume gain routing
                masterGainNode = audioCtx.createGain();
                masterGainNode.connect(audioCtx.destination);
                masterGainNode.gain.value = parseFloat(volumeSlider.value);
            }

            if (AUDIO_TRACKS.length === 0) return;
            let randomTrackIndex = Math.floor(Math.random() * AUDIO_TRACKS.length);
            if (AUDIO_TRACKS.length > 1) {
                while (randomTrackIndex === currentTrackIndex) {
                    randomTrackIndex = Math.floor(Math.random() * AUDIO_TRACKS.length);
                }
            }
            const trackUrl = AUDIO_TRACKS[randomTrackIndex];
            
            try {
                const response = await fetch(trackUrl);
                const arrayBuffer = await response.arrayBuffer();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

                const newSourceNode = audioCtx.createBufferSource();
                newSourceNode.buffer = audioBuffer;

                const newTrackGainNode = audioCtx.createGain();
                newTrackGainNode.gain.setValueAtTime(0, audioCtx.currentTime); // Start track completely silent

                // Route: Individual Source Audio Track Node -> Dynamic Volume Mixer -> Final Audio Driver output
                newSourceNode.connect(newTrackGainNode);
                newTrackGainNode.connect(masterGainNode);

                const now = audioCtx.currentTime;

                // Seamlessly crossfade active tracks
                if (currentTrackGainNode && currentSourceNode) {
                    const oldGain = currentTrackGainNode;
                    const oldSource = currentSourceNode;
                    
                    oldGain.gain.setValueAtTime(oldGain.gain.value, now);
                    oldGain.gain.linearRampToValueAtTime(0, now + FADE_DURATION);
                    
                    setTimeout(() => {
                        try { oldSource.stop(); } catch(e) {}
                    }, FADE_DURATION * 1000);
                }

                newSourceNode.start(now);
                newTrackGainNode.gain.linearRampToValueAtTime(1, now + FADE_DURATION);

                currentSourceNode = newSourceNode;
                currentTrackGainNode = newTrackGainNode;
                currentTrackIndex = randomTrackIndex;
                currentTrackStartedAt = now;
                currentTrackDuration = audioBuffer.duration;
                currentTrackLabel = AUDIO_LABELS[trackUrl] || trackUrl.split('/').pop();

                newSourceNode.onended = () => {
                    if (currentSourceNode === newSourceNode) {
                        handleTrackEnded();
                    }
                };

            } catch (error) {
                console.error("Audio target skipped or execution stalled. Verify hosting permissions:", error);
            }
        }

        function triggerNextCycle() {
            transitionImage();
            if (SKETCH_AUDIO_MODE[activeEntry] === 'ambient-cycle') {
                playRandomAudioTrack();
            }
        }

        function handleTrackEnded() {
            if (activeEntry === '001') {
                transitionImage();
            }
            playRandomAudioTrack();
        }

        // Action Trigger Listeners
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('setup-overlay').style.opacity = '0';
            setTimeout(() => document.getElementById('setup-overlay').style.display = 'none', 500);
            
            document.getElementById('control-panel').classList.add('visible');
            document.getElementById('journal-panel').classList.add('visible');
            showSketchLoader();
            
            triggerNextCycle();
            setInterval(() => {
                if (activeEntry === '001') transitionImage();
            }, 12000); // Entry 001 transitions a new photo mix every 12 seconds independently
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            if (activeEntry === '002') {
                prepareRevealStack(true);
            } else if (activeEntry === '003') {
                prepareCircleMasks(true);
            } else {
                triggerNextCycle();
            }
        });

        journalSelect.addEventListener('change', (event) => switchEntry(event.target.value));

        revealCanvas.addEventListener('pointerdown', (event) => {
            revealCanvas.setPointerCapture(event.pointerId);
            paintPixelReveal(event);
        });
        revealCanvas.addEventListener('pointermove', paintPixelReveal);
        circleMaskCanvas.addEventListener('pointermove', updateCirclePointer);
        circleMaskCanvas.addEventListener('pointerdown', updateCirclePointer);
        processingCanvas.addEventListener('pointermove', updateProcessingPointer);
        processingCanvas.addEventListener('pointerdown', updateProcessingPointer);
        window.addEventListener('resize', resizeRevealCanvas);
        resizeRevealCanvas();
        updateAudioReadout();

        // Sound Engine Value Controllers
        const volumeSlider = document.getElementById('volume-slider');
        const muteBtn = document.getElementById('mute-btn');

        volumeSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            if (masterGainNode) masterGainNode.gain.value = val;
            
            if (val === 0) {
                isMuted = true;
                muteBtn.textContent = '❌';
            } else {
                isMuted = false;
                muteBtn.textContent = '🔊';
            }
        });

        muteBtn.addEventListener('click', () => {
            if (!masterGainNode) return;

            if (!isMuted) {
                preMuteVolume = parseFloat(volumeSlider.value);
                masterGainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                volumeSlider.value = 0;
                muteBtn.textContent = '❌';
                isMuted = true;
            } else {
                masterGainNode.gain.setValueAtTime(preMuteVolume, audioCtx.currentTime);
                volumeSlider.value = preMuteVolume;
                muteBtn.textContent = '🔊';
                isMuted = false;
            }
        });
    </script>
</body>
</html>
